<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏃💨 50km Running Challenge Log</title>
    
    <style>
        /* CSS for Styling */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; background-color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; }
        h1 { color: #333; text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        h2 { color: #555; border-left: 5px solid #ff9800; padding-left: 10px; }
        
        /* Login Form Styling */
        #login-form-container { text-align: center; margin-bottom: 20px; padding: 15px; background-color: #e3f2fd; border-radius: 5px; }
        #login-form { display: flex; justify-content: center; align-items: center; }
        #login-form input[type="text"] { padding: 10px; margin-right: 10px; border-radius: 4px; border: 1px solid #ccc; width: 250px; }
        #login-btn { padding: 10px 20px; background-color: #2196f3; color: white; border: none; cursor: pointer; font-size: 16px; transition: background-color 0.3s; }
        #login-btn:hover { background-color: #1e88e5; }
        
        /* Record Form Styling */
        #record-form { display: none; padding: 20px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 20px; }
        #record-form label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        #record-form input[type="number"], #record-form input[type="text"], #record-form button { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        #record-form button { background-color: #007bff; color: white; border: none; cursor: pointer; font-size: 16px; }
        #record-form button:hover { background-color: #0056b3; }
        
        /* Records List Styling */
        #records-list { list-style: none; padding: 0; }
        .record-item { 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid #ddd; margin-bottom: 10px; padding: 15px; 
            border-radius: 5px; background-color: #f9f9f9; 
        }
        .record-details { flex-grow: 1; padding-right: 15px; }
        /* 💡 เปลี่ยนเป็นลิงก์แทนรูปภาพ (แต่ยังคงแสดงผลได้ถ้าเป็นลิงก์ภาพโดยตรง) */
        .record-photo-link { max-width: 100px; max-height: 100px; border-radius: 4px; object-fit: cover; margin-left: 10px; } 
        .distance { font-size: 1.3em; font-weight: bold; }
        .runner-1 { color: #e91e63; } /* Good Girl */
        .runner-2 { color: #3f51b5; } /* Good Boy */
        
        .delete-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            margin-left: 15px;
            transition: background-color 0.3s;
        }
        .delete-btn:hover { background-color: #d32f2f; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .container { margin: 10px; padding: 10px; }
            .record-item { flex-direction: column; align-items: flex-start; }
            .record-details { padding-right: 0; margin-bottom: 10px; }
            .record-photo-link, .delete-btn { margin-top: 10px; margin-left: 0; }
            #login-form input[type="text"] { width: 100%; margin-right: 0; margin-bottom: 10px; }
            #login-form { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏃 50km Running Challenge</h1>

        <div id="login-form-container">
            <p id="user-status" style="font-size: 1.1em;">Please enter your secret code</p>
            <form id="login-form">
                <input type="text" id="user-code" placeholder="secret code" required>
                <button type="submit" id="login-btn">Log In</button>
            </form>
        </div>

        <form id="record-form">
            <h2>Add New Run Record</h2>
            
            <label for="kilometers">Distance (km):</label>
            <input type="number" id="kilometers" name="kilometers" step="0.01" min="0.1" required>

            <label for="photo-url">Proof Photo URL (Link):</label>
            <input type="text" id="photo-url" name="photo-url" placeholder="Paste link from Imgur, Google Photos, etc." required>

            <button type="submit" id="submit-btn">Add Run Record</button>
        </form>

        <hr>

        <h2>All Running Records</h2>
        <ul id="records-list">
            <li style="text-align: center; color: #999;">Please log in to view records.</li>
        </ul>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <script>
        // **********************************************
        // 2. FIREBASE CONFIG: REPLACE WITH YOUR ACTUAL VALUES
        // **********************************************
	// For Firebase JS SDK v7.20.0 and later, measurementId is optional
	const firebaseConfig = {
  		apiKey: "AIzaSyA73fQs78Th4XGlj7xPfo0cy6GUcNK2f8w",
  		authDomain: "running-record-64b61.firebaseapp.com",
  		projectId: "running-record-64b61",
  		storageBucket: "running-record-64b61.firebasestorage.app",
  		messagingSenderId: "706728904935",
  		appId: "1:706728904935:web:a9fc018c50c062a3feba42",
  		measurementId: "G-39EJ4D4VPP"
	};

        // 3. Custom User Data (with Emojis)
        const USERS = {
            '1101': { uid: 'code_1101_good_girl', name: 'Good Girl 👧', colorClass: 'runner-1' },
            '0502': { uid: 'code_0502_good_boy', name: 'Good Boy 👦', colorClass: 'runner-2' }
        };

        // 4. Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
        const storage = app.storage(); // We keep Storage init just in case, but won't use it for upload

        // 5. Get DOM elements
        const form = document.getElementById('record-form');
        const recordsList = document.getElementById('records-list');
        const submitBtn = document.getElementById('submit-btn');
        const userStatus = document.getElementById('user-status');
        const loginForm = document.getElementById('login-form');
        
        let currentUser = null; 

        // **********************************************
        // Part A: Code Login System
        // **********************************************

        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const code = document.getElementById('user-code').value;
            const user = USERS[code];

            if (user) {
                try {
                    await auth.signInAnonymously(); 

                    currentUser = user; 
                    
                    userStatus.innerHTML = `Welcome back, **${currentUser.name}**! (<a href="#" id="logout-link">Logout</a>)`;
                    loginForm.style.display = 'none';
                    form.style.display = 'block';

                    document.getElementById('logout-link').addEventListener('click', (e) => {
                        e.preventDefault();
                        auth.signOut();
                        handleLogout();
                    });

                    loadAndDisplayRecords(); 

                } catch (error) {
                    console.error("Error signing in anonymously: ", error);
                    alert("Connection error to Firebase. Please check your config and rules.");
                }
            } else {
                alert('Invalid code. Please enter 1101 or 0502.');
            }
        });

        function handleLogout() {
            currentUser = null;
            userStatus.innerHTML = "Please enter your secret code";
            loginForm.style.display = 'flex'; 
            document.getElementById('user-code').value = '';
            form.style.display = 'none';
            recordsList.innerHTML = '<li style="text-align: center; color: #999;">Please log in to view records.</li>';
        }


        // **********************************************
        // Part B: Display and Delete Functionality
        // **********************************************
        
        // Delete function (only deletes Firestore record now)
        async function deleteRecord(docId, photoURL) {
            if (!confirm('Confirm deletion of this record?')) {
                return;
            }

            try {
                // Since we are using an external URL, we don't need to delete from Storage.
                // We just delete the document from Firestore.
                await db.collection('runs').doc(docId).delete();
                
                alert('Record deleted successfully!');

            } catch (error) {
                console.error("Error deleting record: ", error);
                alert(`Error deleting data: ${error.message}`);
            }
        }


        // Display function (uses external URL)
        function displayRecord(data, docId) {
            const listItem = document.createElement('li');
            listItem.className = 'record-item';

            const dateStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString('en-US') : 'N/A';
            const userColorClass = data.colorClass || 'runner-2'; 

            listItem.innerHTML = `
                <div class="record-details">
                    <p class="${userColorClass}" style="margin: 0;">👤 **${data.userName}**</p>
                    <p style="margin: 5px 0 0 0;">🗓️ ${dateStr}</p>
                    <p class="distance ${userColorClass}" style="margin-top: 5px;">${parseFloat(data.km).toFixed(2)} km</p>
                    
                    ${data.photoURL ? `<p style="margin: 5px 0 0 0;">🔗 <a href="${data.photoURL}" target="_blank">View Proof</a></p>` : ''}
                </div>
                
                <button class="delete-btn" data-id="${docId}">Delete</button>
            `;
            recordsList.prepend(listItem);
            
            const deleteButton = listItem.querySelector('.delete-btn');
            if (deleteButton) {
                 // Note: photoURL is null now, but the function still works by skipping storage deletion
                 deleteButton.addEventListener('click', () => deleteRecord(deleteButton.dataset.id, null));
            }
        }


        function loadAndDisplayRecords() {
            recordsList.innerHTML = '<li style="text-align: center; color: #999;">Loading records...</li>';
             
            db.collection("runs").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                recordsList.innerHTML = '';
                if (snapshot.empty) {
                     recordsList.innerHTML = '<li style="text-align: center; color: #999;">No running records yet.</li>';
                     return;
                }
                snapshot.forEach((doc) => {
                    displayRecord(doc.data(), doc.id); 
                });
            }, (error) => {
                console.error("Error loading documents: ", error);
                recordsList.innerHTML = '<li style="text-align: center; color: red;">Error loading data.</li>';
            });
        }
        

        // 7. Save Run Record (Using URL Link)
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            if (!currentUser) {
                alert('Please log in with your secret code first.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving record...'; 

            const km = document.getElementById('kilometers').value;
            const photoURL = document.getElementById('photo-url').value; // Get URL from input

            if (!km || !photoURL) {
                alert('Please enter distance and proof URL.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Run Record';
                return;
            }

            try {
                // Save to Firestore (no Storage upload needed)
                await db.collection("runs").add({
                    userId: currentUser.uid,
                    userName: currentUser.name, 
                    colorClass: currentUser.colorClass, 
                    km: parseFloat(km),
                    photoURL: photoURL, // Save the external URL
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('Run record saved successfully!');
                form.reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert(`Error saving data: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Run Record';
            }
        });
    </script>
</body>
</html>
