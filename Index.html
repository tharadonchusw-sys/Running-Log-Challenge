<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏃💨 Running Challenge Log</title>
    
    <style>
        /* CSS สำหรับจัดรูปแบบ */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; background-color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; }
        h1 { color: #333; text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        h2 { color: #555; border-left: 5px solid #ff9800; padding-left: 10px; }
        
        #login-status { text-align: center; margin-bottom: 20px; padding: 15px; background-color: #ffe0b2; border-radius: 5px; }
        #google-login-btn { padding: 10px 20px; background-color: #db4437; color: white; border: none; cursor: pointer; border-radius: 4px; font-size: 16px; transition: background-color 0.3s; }
        #google-login-btn:hover { background-color: #c33d32; }
        
        #record-form { display: none; padding: 20px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 20px; }
        #record-form label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        #record-form input[type="number"], #record-form input[type="file"], #record-form button { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        #record-form button { background-color: #007bff; color: white; border: none; cursor: pointer; font-size: 16px; }
        #record-form button:hover { background-color: #0056b3; }
        
        #records-list { list-style: none; padding: 0; }
        .record-item { 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid #ddd; margin-bottom: 10px; padding: 15px; 
            border-radius: 5px; background-color: #f9f9f9; 
        }
        .record-details { flex-grow: 1; padding-right: 15px; }
        .record-photo { max-width: 100px; max-height: 100px; border-radius: 4px; object-fit: cover; }
        .distance { font-size: 1.3em; font-weight: bold; }
        .runner-1 { color: #007bff; } /* สีน้ำเงินสำหรับผู้ใช้คนแรก */
        .runner-2 { color: #28a745; } /* สีเขียวสำหรับผู้ใช้คนที่สอง (และคนอื่นๆ) */

        /* สำหรับหน้าจอมือถือ */
        @media (max-width: 600px) {
            .container { margin: 10px; padding: 10px; }
            .record-item { flex-direction: column; align-items: flex-start; }
            .record-details { padding-right: 0; margin-bottom: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏃 Running Challenge Log</h1>

        <div id="login-status">
            <p id="user-status" style="font-size: 1.1em;"></p>
            <button id="google-login-btn">ล็อกอินด้วย Google</button>
        </div>

        <form id="record-form">
            <h2>Add New Run Record</h2>
            
            <label for="kilometers">Distance (km):</label>
            <input type="number" id="kilometers" name="kilometers" step="0.01" min="0.1" required>

            <label for="run-photo">Upload Proof Photo:</label>
            <input type="file" id="run-photo" name="run-photo" accept="image/*" required>

            <button type="submit" id="submit-btn">Add Run Record</button>
        </form>

        <hr>

        <h2>All Running Records</h2>
        <ul id="records-list">
            <li style="text-align: center; color: #999;">กรุณาล็อกอินเพื่อดูสถิติ</li>
        </ul>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <script>
        // **********************************************
        // 2. ข้อมูล CONFIG: ต้องเปลี่ยนเป็นค่าที่คุณได้จาก Firebase Console
        // **********************************************
	// For Firebase JS SDK v7.20.0 and later, measurementId is optional
	const firebaseConfig = {
  		apiKey: "AIzaSyA73fQs78Th4XGlj7xPfo0cy6GUcNK2f8w",
 		authDomain: "running-record-64b61.firebaseapp.com",
  		projectId: "running-record-64b61",
  		storageBucket: "running-record-64b61.firebasestorage.app",
  		messagingSenderId: "706728904935",
  		appId: "1:706728904935:web:a9fc018c50c062a3feba42",
  		measurementId: "G-39EJ4D4VPP"
	};

        // 3. เริ่มต้น Firebase และบริการต่างๆ
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
        const storage = app.storage();

        // 4. สร้างตัวแปรสำหรับองค์ประกอบต่างๆ
        const form = document.getElementById('record-form');
        const recordsList = document.getElementById('records-list');
        const submitBtn = document.getElementById('submit-btn');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const userStatus = document.getElementById('user-status');
        
        // **********************************************
        // ส่วน A: ระบบล็อกอิน (Authentication)
        // **********************************************
        
        // ฟังก์ชันจัดการล็อกอิน
        googleLoginBtn.addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .catch(error => {
                    if (error.code !== 'auth/popup-closed-by-user') {
                        alert(`Login Failed: ${error.message}`);
                    }
                });
        });

        // ฟังก์ชันแสดงผลรายการวิ่ง
        function displayRecord(data) {
            const listItem = document.createElement('li');
            listItem.className = 'record-item';

            const dateStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString('th-TH') : 'N/A';
            const userDisplayName = data.userName || 'Runner'; 
            
            // กำหนดสีตาม User ID เพื่อแยกผู้แข่งขัน 2 คน
            let userClass = 'runner-2'; 
            // หากคุณต้องการกำหนดสีให้ผู้ใช้คนแรก (ผู้สร้าง) เป็นสีน้ำเงิน
            // ให้ตรวจสอบใน Firebase ว่า User ID ของผู้ใช้คนแรกคืออะไร
            // สมมติว่า ID ของผู้ใช้คนแรกคือ 'ABCDEFGHIJ' 
            /*
            if (data.userId === 'ABCDEFGHIJ') { 
                userClass = 'runner-1'; 
            } else {
                userClass = 'runner-2';
            }
            */

            listItem.innerHTML = `
                <div class="record-details">
                    <p class="${userClass}" style="margin: 0;">👤 **${userDisplayName}**</p>
                    <p style="margin: 5px 0 0 0;">🗓️ ${dateStr}</p>
                    <p class="distance ${userClass}" style="margin-top: 5px;">${parseFloat(data.km).toFixed(2)} km</p>
                </div>
                ${data.photoURL ? `<img src="${data.photoURL}" alt="Run Photo" class="record-photo">` : ''}
            `;
            recordsList.prepend(listItem);
        }

        // 5. โหลดและแสดงข้อมูลการวิ่งทั้งหมดของผู้ใช้ทุกคน
        function loadAndDisplayRecords() {
            recordsList.innerHTML = '<li style="text-align: center; color: #999;">Loading records...</li>';
             // .onSnapshot คือการเปิดฟังการเปลี่ยนแปลงของข้อมูลแบบ Real-time
            db.collection("runs").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                recordsList.innerHTML = '';
                if (snapshot.empty) {
                     recordsList.innerHTML = '<li style="text-align: center; color: #999;">ยังไม่มีสถิติการวิ่ง</li>';
                     return;
                }
                snapshot.forEach((doc) => {
                    displayRecord(doc.data());
                });
            }, (error) => {
                console.error("Error loading documents: ", error);
                recordsList.innerHTML = '<li style="text-align: center; color: red;">Error loading data.</li>';
            });
        }
        
        // 6. จัดการสถานะการล็อกอิน (เมื่อผู้ใช้เข้า/ออกระบบ)
        auth.onAuthStateChanged(user => {
            if (user) {
                // ผู้ใช้ล็อกอินแล้ว
                userStatus.innerHTML = `Welcome, **${user.displayName}**! (<a href="#" id="logout-link">Logout</a>)`;
                form.style.display = 'block'; 
                googleLoginBtn.style.display = 'none';
                
                document.getElementById('logout-link').addEventListener('click', (e) => {
                    e.preventDefault();
                    auth.signOut();
                });
                
                loadAndDisplayRecords(); // โหลดข้อมูลเมื่อล็อกอินแล้ว
            } else {
                // ผู้ใช้ออกจากระบบแล้ว
                userStatus.innerHTML = "Please login to track and view runs.";
                form.style.display = 'none'; 
                googleLoginBtn.style.display = 'block';
                recordsList.innerHTML = '<li style="text-align: center; color: #999;">กรุณาล็อกอินเพื่อดูสถิติ</li>';
            }
        });


        // 7. บันทึกข้อมูลการวิ่ง
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            const user = auth.currentUser;
            if (!user) {
                alert('กรุณาล็อกอินก่อนบันทึกข้อมูล');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังอัปโหลด...';

            const km = document.getElementById('kilometers').value;
            const photoFile = document.getElementById('run-photo').files[0];

            if (!km || !photoFile) {
                alert('กรุณาใส่ระยะทางและรูปภาพให้ครบถ้วน');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Run Record';
                return;
            }

            try {
                // A. อัปโหลดรูปภาพไปที่ Firebase Storage
                const storageRef = storage.ref();
                const photoName = `${user.uid}/${Date.now()}-${photoFile.name}`; // แยกไฟล์ตาม User ID
                const photoRef = storageRef.child(`run_photos/${photoName}`);
                
                const uploadTask = await photoRef.put(photoFile);
                const photoURL = await uploadTask.ref.getDownloadURL();

                // B. บันทึกข้อมูลลงใน Firestore
                await db.collection("runs").add({
                    userId: user.uid,
                    userName: user.displayName, // เก็บชื่อผู้ใช้ที่ล็อกอิน
                    km: parseFloat(km),
                    photoURL: photoURL,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('บันทึกสถิติการวิ่งเรียบร้อยแล้ว!');
                form.reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert(`เกิดข้อผิดพลาดในการบันทึกข้อมูล: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Run Record';
            }
        });
    </script>
</body>
</html>
