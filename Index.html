<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏃💨 Running Challenge Log (Code Login + Delete)</title>
    
    <style>
        /* CSS สำหรับจัดรูปแบบ */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; background-color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; }
        h1 { color: #333; text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        h2 { color: #555; border-left: 5px solid #ff9800; padding-left: 10px; }
        
        #login-form-container { text-align: center; margin-bottom: 20px; padding: 15px; background-color: #e3f2fd; border-radius: 5px; }
        #login-form input[type="text"] { padding: 10px; margin: 5px; border-radius: 4px; border: 1px solid #ccc; }
        #login-btn { padding: 10px 20px; background-color: #2196f3; color: white; border: none; cursor: pointer; font-size: 16px; transition: background-color 0.3s; }
        #login-btn:hover { background-color: #1e88e5; }
        
        #record-form { display: none; padding: 20px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 20px; }
        #record-form label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        #record-form input[type="number"], #record-form input[type="file"], #record-form button { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        #record-form button { background-color: #007bff; color: white; border: none; cursor: pointer; font-size: 16px; }
        #record-form button:hover { background-color: #0056b3; }
        
        #records-list { list-style: none; padding: 0; }
        .record-item { 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid #ddd; margin-bottom: 10px; padding: 15px; 
            border-radius: 5px; background-color: #f9f9f9; 
        }
        .record-details { flex-grow: 1; padding-right: 15px; }
        .record-photo { max-width: 100px; max-height: 100px; border-radius: 4px; object-fit: cover; margin-left: 10px; }
        .distance { font-size: 1.3em; font-weight: bold; }
        .runner-1 { color: #e91e63; } /* Good Girl - ชมพู */
        .runner-2 { color: #3f51b5; } /* Good Boy - น้ำเงิน */
        
        .delete-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            margin-left: 15px;
            transition: background-color 0.3s;
        }
        .delete-btn:hover { background-color: #d32f2f; }

        /* สำหรับหน้าจอมือถือ */
        @media (max-width: 600px) {
            .container { margin: 10px; padding: 10px; }
            .record-item { flex-direction: column; align-items: flex-start; }
            .record-details { padding-right: 0; margin-bottom: 10px; }
            .record-photo, .delete-btn { margin-top: 10px; margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏃 50km Running Challenge</h1>

        <div id="login-form-container">
            <p id="user-status" style="font-size: 1.1em;">Please enter your secret code</p>
            <form id="login-form">
                <input type="text" id="user-code" placeholder="secret code" required>
                <button type="submit" id="login-btn">Log in</button>
            </form>
        </div>

        <form id="record-form">
            <h2>Add New Run Record</h2>
            
            <label for="kilometers">Distance (km):</label>
            <input type="number" id="kilometers" name="kilometers" step="0.01" min="0.1" required>

            <label for="run-photo">Upload Proof Photo:</label>
            <input type="file" id="run-photo" name="run-photo" accept="image/*" required>

            <button type="submit" id="submit-btn">Add Run Record</button>
        </form>

        <hr>

        <h2>All Running Records</h2>
        <ul id="records-list">
            <li style="text-align: center; color: #999;">Please log in to view records.</li>
        </ul>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/pica@6.1.1/dist/pica.min.js"></script>

    <script>
        // **********************************************
        // 3. ข้อมูล CONFIG: ต้องเปลี่ยนเป็นค่าที่คุณได้จาก Firebase Console
        // **********************************************
	// For Firebase JS SDK v7.20.0 and later, measurementId is optional
	const firebaseConfig = {
  		apiKey: "AIzaSyA73fQs78Th4XGlj7xPfo0cy6GUcNK2f8w",
  		authDomain: "running-record-64b61.firebaseapp.com",
  		projectId: "running-record-64b61",
  		storageBucket: "running-record-64b61.firebasestorage.app",
  		messagingSenderId: "706728904935",
  		appId: "1:706728904935:web:a9fc018c50c062a3feba42",
  		measurementId: "G-39EJ4D4VPP"
	};

        // 4. ข้อมูลผู้ใช้แบบกำหนดเอง (User Dictionary)
        const USERS = {
            '1101': { uid: 'code_1101_good_girl', name: 'Good Girl👧🏻', colorClass: 'runner-1' },
            '0502': { uid: 'code_0502_good_boy', name: 'Good Boy👦🏻', colorClass: 'runner-2' }
        };

        // 5. เริ่มต้น Firebase และบริการต่างๆ
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
        const storage = app.storage();

        // 6. สร้างตัวแปรสำหรับองค์ประกอบต่างๆ
        const form = document.getElementById('record-form');
        const recordsList = document.getElementById('records-list');
        const submitBtn = document.getElementById('submit-btn');
        const userStatus = document.getElementById('user-status');
        const loginForm = document.getElementById('login-form');
        
        // ตัวแปรสำหรับเก็บข้อมูลผู้ใช้ที่ล็อกอินปัจจุบัน
        let currentUser = null; 

        // **********************************************
        // ส่วน A: ระบบล็อกอิน (Code Login)
        // **********************************************

        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const code = document.getElementById('user-code').value;
            const user = USERS[code];

            if (user) {
                try {
                    await auth.signInAnonymously(); 

                    currentUser = user; 
                    
                    userStatus.innerHTML = `Welcome back, **${currentUser.name}**! (<a href="#" id="logout-link">Logout</a>)`;
                    loginForm.style.display = 'none';
                    form.style.display = 'block';

                    document.getElementById('logout-link').addEventListener('click', (e) => {
                        e.preventDefault();
                        auth.signOut();
                        handleLogout();
                    });

                    loadAndDisplayRecords(); 

                } catch (error) {
                    console.error("Error signing in anonymously: ", error);
                    alert("เกิดข้อผิดพลาดในการเชื่อมต่อ Firebase");
                }
            } else {
                alert('รหัสไม่ถูกต้อง กรุณาใส่รหัส 1101 หรือ 0502');
            }
        });

        function handleLogout() {
            currentUser = null;
            userStatus.innerHTML = "กรุณาใส่รหัสประจำตัวเพื่อเข้าสู่ระบบ";
            loginForm.style.display = 'flex'; 
            document.getElementById('user-code').value = '';
            form.style.display = 'none';
            recordsList.innerHTML = '<li style="text-align: center; color: #999;">กรุณาเข้าสู่ระบบเพื่อดูสถิติ</li>';
        }


        // **********************************************
        // ส่วน B: การแสดงผลและการลบข้อมูล
        // **********************************************
        
        // 💡 ฟังก์ชันใหม่: ลบรายการ (ทั้ง Firestore และ Storage)
        async function deleteRecord(docId, photoURL) {
            // 1. ถามผู้ใช้เพื่อยืนยัน
            if (!confirm('Confirm to deleted? Running data and photos will be permanently deleted.')) {
                return;
            }

            try {
                // 2. ลบรูปภาพจาก Storage (ถ้ามี)
                if (photoURL && photoURL.startsWith('http')) {
                    const photoRef = storage.refFromURL(photoURL);
                    await photoRef.delete();
                    console.log("Photo deleted from Storage successfully.");
                }
                
                // 3. ลบ Document จาก Firestore
                await db.collection('runs').doc(docId).delete();
                
                alert('The record has been deleted!');
                // รายการจะอัปเดตอัตโนมัติเนื่องจาก onSnapshot 

            } catch (error) {
                console.error("Error deleting record: ", error);
                // ถ้าเป็น error ว่ารูปภาพหาไม่เจอ (storage/object-not-found) เราจะแค่ลบเอกสารใน Firestore ต่อไป
                if (error.code !== 'storage/object-not-found') {
                    alert(`เกิดข้อผิดพลาดในการลบ: ${error.message}`);
                } else {
                    // ถ้าเกิดว่ารูปถูกลบไปแล้ว ให้ลองลบ Document ต่อ
                    try {
                         await db.collection('runs').doc(docId).delete();
                         alert('ลบสถิติเรียบร้อยแล้ว! (รูปภาพหาไม่พบแต่ข้อมูลถูกลบ)');
                    } catch (e) {
                         alert(`เกิดข้อผิดพลาดในการลบ: ${e.message}`);
                    }
                }
            }
        }


        // 💡 ฟังก์ชันแสดงผลรายการวิ่ง (รับ docId เข้ามา)
        function displayRecord(data, docId) {
            const listItem = document.createElement('li');
            listItem.className = 'record-item';

            const dateStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString('th-TH') : 'N/A';
            const userColorClass = data.colorClass || 'runner-2'; 

            listItem.innerHTML = `
                <div class="record-details">
                    <p class="${userColorClass}" style="margin: 0;">👤 **${data.userName}**</p>
                    <p style="margin: 5px 0 0 0;">🗓️ ${dateStr}</p>
                    <p class="distance ${userColorClass}" style="margin-top: 5px;">${parseFloat(data.km).toFixed(2)} km</p>
                </div>
                ${data.photoURL ? `<img src="${data.photoURL}" alt="Run Photo" class="record-photo">` : ''}
                
                <button class="delete-btn" data-id="${docId}" data-photo-url="${data.photoURL}">ลบ</button>
            `;
            recordsList.prepend(listItem);
            
            // ผูก Event Listener กับปุ่มลบ
            const deleteButton = listItem.querySelector('.delete-btn');
            if (deleteButton) {
                 deleteButton.addEventListener('click', () => deleteRecord(deleteButton.dataset.id, deleteButton.dataset.photoUrl));
            }
        }

        // 💡 ฟังก์ชันโหลดและแสดงข้อมูลการวิ่ง (ดึง docId ด้วย)
        function loadAndDisplayRecords() {
            recordsList.innerHTML = '<li style="text-align: center; color: #999;">กำลังโหลดสถิติ...</li>';
             
            db.collection("runs").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                recordsList.innerHTML = '';
                if (snapshot.empty) {
                     recordsList.innerHTML = '<li style="text-align: center; color: #999;">ยังไม่มีสถิติการวิ่ง</li>';
                     return;
                }
                snapshot.forEach((doc) => {
                    // ดึง Document ID (doc.id) และส่งไปที่ displayRecord
                    displayRecord(doc.data(), doc.id); 
                });
            }, (error) => {
                console.error("Error loading documents: ", error);
                recordsList.innerHTML = '<li style="text-align: center; color: red;">Error loading data.</li>';
            });
        }
        
        // ฟังก์ชันลดขนาดรูปภาพ (เหมือนเดิม)
        function resizeImage(file, maxSize) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxSize) {
                            height *= maxSize / width;
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width *= maxSize / height;
                            height = maxSize;
                        }
                    }
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    pica().resize(img, canvas)
                        .then(result => pica().toBlob(result, 'image/jpeg', 0.75)) 
                        .then(blob => resolve(blob))
                        .catch(error => reject(error));
                };
                img.onerror = (error) => reject(error);
                img.src = URL.createObjectURL(file);
            });
        }


        // 7. บันทึกข้อมูลการวิ่ง (เหมือนเดิม)
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            if (!currentUser) {
                alert('กรุณาเข้าสู่ระบบด้วยรหัสประจำตัวก่อนบันทึกข้อมูล');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังประมวลผลรูปภาพ...'; 

            const km = document.getElementById('kilometers').value;
            const photoFile = document.getElementById('run-photo').files[0];

            if (!km || !photoFile) {
                alert('กรุณาใส่ระยะทางและรูปภาพให้ครบถ้วน');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Run Record';
                return;
            }

            try {
                // A. ลดขนาดรูปภาพ (Resizing)
                const MAX_SIZE = 1200; 
                const resizedBlob = await resizeImage(photoFile, MAX_SIZE); 
                
                submitBtn.textContent = 'กำลังอัปโหลดรูปภาพ...'; 

                // B. อัปโหลดรูปภาพที่ถูกลดขนาดแล้ว
                const storageRef = storage.ref();
                const photoName = `${currentUser.uid}/${Date.now()}-${photoFile.name}`; 
                const photoRef = storageRef.child(`run_photos/${photoName}`);
                
                const uploadTask = await photoRef.put(resizedBlob, { contentType: 'image/jpeg' }); 
                const photoURL = await uploadTask.ref.getDownloadURL();

                // C. บันทึกข้อมูลลงใน Firestore
                await db.collection("runs").add({
                    userId: currentUser.uid,
                    userName: currentUser.name, 
                    colorClass: currentUser.colorClass, 
                    km: parseFloat(km),
                    photoURL: photoURL,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('บันทึกสถิติการวิ่งเรียบร้อยแล้ว!');
                form.reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert(`เกิดข้อผิดพลาดในการบันทึกข้อมูล: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Run Record';
            }
        });
    </script>
</body>
</html>
